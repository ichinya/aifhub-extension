schema: aifhub.memory_tools.recommendation.v1
updated: "2026-07-19"
purpose: "Метаданные для этапа анализа проекта: какие memory/retrieval инструменты можно предлагать пользователю, когда и с какими ограничениями."
default_policy:
  install_policy: explicit_user_opt_in_only
  never_auto_install: true
  require_explicit_paths: true
  require_purge_path: true
  baseline_tool: rg
  privacy_rule: "Не предлагать инструмент, если read scope не ограничен или purge path не проверен."
skill_usage_matrix:
  aif-analyze:
    allowed:
      - rg
      - graphify
      - context7
      - codex-agent-mem
      - context-mode
      - codegraph
      - repowise
    forbidden:
      - codex-mem
      - eagle-mem
      - rohitg00-agentmemory
    notes: "Recommend only; do not install, setup, index, register MCP, mutate provider config, or treat provider output as evidence."
  aif-explore:
    allowed:
      - rg
      - graphify
      - context7
      - codex-agent-mem
      - context-mode
      - codegraph
      - repowise
    forbidden:
      - codex-mem
      - eagle-mem
      - rohitg00-agentmemory
    notes: "Read existing reviewed provider output, or use explicitly enabled tools only when metadata grants command-specific permission and purge is defined."
  aif-architecture:
    allowed:
      - rg
      - graphify
      - context7
    forbidden:
      - codex-agent-mem
      - context-mode
      - codex-mem
      - eagle-mem
      - codegraph
      - repowise
      - rohitg00-agentmemory
    notes: "Project-level architecture context only; optional provider output is supporting reviewed context and must not drive OpenSpec writes."
  aif-plan:
    allowed:
      - rg
      - graphify
      - context7
    forbidden:
      - codex-agent-mem
      - context-mode
      - codex-mem
      - eagle-mem
      - codegraph
      - rohitg00-agentmemory
    notes: "Optional supporting context before writing canonical OpenSpec artifacts; final plan must use direct repository evidence."
  aif-review:
    allowed:
      - rg
      - graphify
      - context7
      - codex-agent-mem
      - repowise
    forbidden:
      - context-mode
      - codex-mem
      - eagle-mem
      - codegraph
      - rohitg00-agentmemory
    notes: "Optional supporting context for impact/docs/closure checks only."
  aif-rules-check:
    allowed:
      - rg
      - context7
    forbidden:
      - graphify
      - codex-agent-mem
      - context-mode
      - codex-mem
      - eagle-mem
      - codegraph
      - rohitg00-agentmemory
    notes: "Context7 may support version-sensitive external docs only; generated rules and source evidence remain authoritative."
  aif-implement:
    allowed:
      - rg
    forbidden:
      - graphify
      - context7
      - codex-agent-mem
      - context-mode
      - codex-mem
      - eagle-mem
      - codegraph
      - rohitg00-agentmemory
    notes: "Implementation commands must not use optional context providers by default."
  aif-fix:
    allowed:
      - rg
    forbidden:
      - graphify
      - context7
      - codex-agent-mem
      - context-mode
      - codex-mem
      - eagle-mem
      - codegraph
      - rohitg00-agentmemory
    notes: "Fix commands must use QA evidence, source files, and canonical OpenSpec context."
  aif-verify:
    allowed:
      - rg
    forbidden:
      - graphify
      - context7
      - codex-agent-mem
      - context-mode
      - codex-mem
      - eagle-mem
      - codegraph
      - rohitg00-agentmemory
    notes: "Verification must stay source-grounded and provider-independent."
  aif-done:
    allowed:
      - rg
    forbidden:
      - graphify
      - context7
      - codex-agent-mem
      - context-mode
      - codex-mem
      - eagle-mem
      - codegraph
      - rohitg00-agentmemory
    notes: "Done/finalization must not depend on optional provider availability or output."
  aif-commit:
    allowed:
      - rg
    forbidden:
      - graphify
      - context7
      - codex-agent-mem
      - context-mode
      - codex-mem
      - eagle-mem
      - codegraph
      - rohitg00-agentmemory
    notes: "Commit freshness checks may use direct repository and local artifact evidence only."
permissions:
  recommend_only:
    description: "May suggest manual usage; cannot run setup, indexing, MCP registration, sync, hooks, or background services."
  read_existing_reviewed_output:
    description: "May read already-created reviewed notes or reports from allowed paths."
  safe_availability_probe:
    description: "May run local non-mutating --version, --help, doctor, or status probes."
  manual_user_owned_execution:
    description: "User may run manually outside AIFHub command ownership."
  manual_purged_cli_execution:
    description: "May run a scoped CLI lifecycle against an explicit project path only when the selection CLI returns the tool for this command, then purge the tool-owned local index before finishing."
  forbidden:
    description: "Do not suggest or use for this command."
tool_permissions:
  rg:
    aif-analyze: safe_availability_probe
    aif-explore: safe_availability_probe
    aif-architecture: safe_availability_probe
    aif-plan: safe_availability_probe
    aif-review: safe_availability_probe
    aif-rules-check: safe_availability_probe
    aif-implement: safe_availability_probe
    aif-fix: safe_availability_probe
    aif-verify: safe_availability_probe
    aif-done: safe_availability_probe
    aif-commit: safe_availability_probe
  graphify:
    aif-analyze: recommend_only
    aif-explore: read_existing_reviewed_output
    aif-architecture: read_existing_reviewed_output
    aif-plan: read_existing_reviewed_output
    aif-review: read_existing_reviewed_output
    aif-rules-check: forbidden
    aif-implement: forbidden
    aif-fix: forbidden
    aif-verify: forbidden
    aif-done: forbidden
    aif-commit: forbidden
  context7:
    aif-analyze: recommend_only
    aif-explore: read_existing_reviewed_output
    aif-architecture: read_existing_reviewed_output
    aif-plan: read_existing_reviewed_output
    aif-review: read_existing_reviewed_output
    aif-rules-check: read_existing_reviewed_output
    aif-implement: forbidden
    aif-fix: forbidden
    aif-verify: forbidden
    aif-done: forbidden
    aif-commit: forbidden
  codex-agent-mem:
    aif-analyze: recommend_only
    aif-explore: read_existing_reviewed_output
    aif-architecture: forbidden
    aif-plan: forbidden
    aif-review: read_existing_reviewed_output
    aif-rules-check: forbidden
    aif-implement: forbidden
    aif-fix: forbidden
    aif-verify: forbidden
    aif-done: forbidden
    aif-commit: forbidden
  context-mode:
    aif-analyze: recommend_only
    aif-explore: recommend_only
    aif-architecture: forbidden
    aif-plan: forbidden
    aif-review: forbidden
    aif-rules-check: forbidden
    aif-implement: forbidden
    aif-fix: forbidden
    aif-verify: forbidden
    aif-done: forbidden
    aif-commit: forbidden
  agent-memory:
    default: recommend_only_if_user_requests_manual_notes
  rohitg00-agentmemory:
    default: forbidden
  codex-mem:
    default: forbidden
  eagle-mem:
    default: forbidden
  codegraph:
    aif-analyze: recommend_only
    aif-explore: manual_purged_cli_execution
    aif-architecture: forbidden
    default: forbidden
  repowise:
    aif-analyze: recommend_only
    aif-explore: manual_purged_cli_execution
    aif-review: recommend_only
    default: forbidden
availability_probes:
  rg:
    - rg --version
  uv:
    - uv --version
  graphify:
    - graphify --version
    - graphify --help
  context7:
    - ctx7 --version
    - npx --no-install ctx7 --help
  codex-agent-mem:
    - codex-agent-mem-policy --help
    - codex-agent-mem-smoke --help
  context-mode:
    - context-mode doctor
  codegraph:
    - codegraph --version
    - codegraph --help
    - codegraph status
  repowise:
    - repowise --version
    - repowise doctor
forbidden_operations:
  - auto_install
  - auto_run_setup
  - auto_index_source
  - auto_sync_memory
  - auto_register_mcp
  - mutate_provider_config
  - install_hooks
  - start_background_daemons
  - rewrite_validation_artifacts
protected_artifacts:
  - aif-gate-result
  - coverage.json
  - done-readiness.json
  - openspec/specs/**
  - openspec/changes/**/specs/**
  - .ai-factory/rules/generated/openspec-rules-trace-*.json
  - exact evidence snippets
project_dimensions:
  languages: [php, go, js, python, rust, multi]
  volume: [mini, standard, large]
  complexity: [mini, framework, legacy, integration_heavy]
  repo_shape: [single_repo, monorepo, multirepo]
  artifact_mode: [openspec_native, legacy_ai_factory_only, none]
benchmark_matrix:
  ai_tester:
    result_schema: aifhub.memory_tools.ai_tester_matrix.v1
    suites: [baseline, positive, negative, overhead, docs-version, continuity]
    scenario_contract:
      allowed_expectations: [baseline_rg, positive, negative, overhead, not_applicable]
      installed_wrapper: "ai-factory aifhub-memory-tools"
      source_repo_fallback: "node scripts/memory-tool-recommender.mjs"
      required_assertions: [tool_called, tool_call_sequence, no_tool_called, output_contains, turn_count_at_most, no_path_escape]
      default_codex_model: gpt-5.4-mini
      require_unique_scenario_prefix: true
      scenario_prefix_reason: "ai-tester stores traces globally by scenario id; new matrix runs need a prefix to avoid reusing old traces with the same anonymous profile ids."
    decision_actions: [recommend, conditional, avoid, forbid]
    comparison_metrics:
      - wall_clock_ms_delta
      - token_estimate_delta
      - ai_tester_token_delta
      - output_noise_delta
      - accuracy_delta
      - usefulness_vs_rg
      - safety_status
      - purge_status
    reduced_matrix_policy:
      default_matrix_size: screening
      reason: "The goal is to detect when a tool is beneficial, not to exhaustively prove every skill/project pair before screening."
      presets:
        screening:
          selected_profiles: 15
          profile_mode: stratified
          skill_set: grouped
          task_set: primary
          expected_scenarios_per_tool: 300
          use_for: "First pass: find token/time/result signals by project dimension and representative skill group."
        profile-sweep:
          selected_profiles: 47
          profile_mode: all
          skill_set: high-signal
          task_set: primary
          expected_scenarios_per_tool: 376
          use_for: "Confirm project-label rules after screening finds likely useful skill groups."
        skill-sweep:
          selected_profiles: 8
          profile_mode: stratified
          skill_set: all
          task_set: primary
          expected_scenarios_per_tool: 464
          use_for: "Check all AI Factory skills on a small project sample."
        full:
          profile_mode: all
          skill_set: metadata
          task_set: primary
          use_for: "Audit mode only; use --skill-set all for exhaustive all-skill coverage."
      exhaustive_all_skills_warning: "29 skills * 47 profiles * 2 runs = 2726 scenarios per tool/task; do not run this by default."
    skill_test_groups:
      - id: bootstrap_analysis
        representatives: [aif-analyze]
        members: [aif, aif-init, aif-analyze, aif-mode]
        rationale: "Project classification, metadata, and setup-oriented repository reading."
      - id: research_architecture
        representatives: [aif-explore]
        members: [aif-explore, aif-architecture, aif-grounded]
        rationale: "Broad discovery and architecture/impact investigation."
      - id: planning_refinement
        representatives: [aif-plan]
        members: [aif-plan, aif-improve, aif-roadmap, aif-loop]
        rationale: "Planning and iterative refinement over gathered context."
      - id: implementation_fix
        representatives: [aif-implement, aif-fix]
        members: [aif-implement, aif-fix]
        rationale: "Source edits, bug fixes, and direct implementation workflows."
      - id: review_quality_gates
        representatives: [aif-review, aif-rules-check, aif-verify]
        members: [aif-review, aif-qa, aif-rules-check, aif-security-checklist, aif-verify, aif-done]
        rationale: "Review, rules, security, QA, and completion gates."
      - id: generation_output
        representatives: [aif-docs]
        members: [aif-build-automation, aif-ci, aif-dockerize, aif-docs, aif-reference, aif-rules, aif-skill-generator]
        rationale: "Generated files or documentation based on repository context."
      - id: commit_finalization
        representatives: [aif-commit]
        members: [aif-commit]
        rationale: "Diff summarization and commit message workflow."
      - id: guidance_only
        representatives: []
        members: [aif-best-practices, aif-evolve]
        rationale: "Guidance/meta skills are excluded from screening; sample explicitly if needed."
dimension_signals:
  mini_go_service:
    match:
      languages: [go]
      volume: mini
      repo_shape: single_repo
    baseline_first: [rg]
    avoid_tools: [graphify, codegraph, context-mode]
    decision_action: avoid
    evidence: ai-tester-matrix-contract-2026-05-26
  mini_exact_lookup:
    match:
      volume: mini
    baseline_first: [rg]
    avoid_tools: [graphify, codegraph, context-mode]
    decision_action: avoid
    evidence: ai-tester-matrix-contract-2026-05-26
  large_framework_broad_discovery:
    match:
      volume: large
      complexity: framework
    baseline_first: [rg]
    suggest_tools: []
    conditional_tools: [context7, codex-agent-mem]
    tasks: [architecture_or_impact_discovery, multirepo_surface_mapping]
    decision_action: conditional
    quality_gate: "Graphify and CodeGraph are no longer selected by broad large/framework labels; CodeGraph needs exact screening_policy match, Graphify needs explicit quality experiment opt-in."
    evidence: targeted-graphify-context7-ai-tester-2026-05-28
  multirepo_surface_mapping:
    match:
      repo_shape: multirepo
    baseline_first: [rg]
    suggest_tools: []
    conditional_tools: [codex-agent-mem]
    tasks: [multirepo_surface_mapping, architecture_or_impact_discovery]
    decision_action: conditional
    quality_gate: "Multirepo alone is not enough for Graphify or CodeGraph. CodeGraph needs exact screening_policy match; Graphify needs explicit quality experiment opt-in."
    evidence: targeted-graphify-context7-ai-tester-2026-05-28
  legacy_integration_heavy:
    match:
      complexity: integration_heavy
    baseline_first: [rg]
    conditional_tools: [context-mode]
    avoid_tools: [codex-mem, eagle-mem]
    decision_action: conditional
    evidence: ai-tester-matrix-contract-2026-05-26
project_shape_signals:
  large_legacy:
    description: "Большой legacy проект с плотными интеграциями, большим числом файлов и шумным literal search."
    conditional_tools: []
    condition: "Repo graph tools do not become applicable from legacy/integration labels alone; use exact tool policies."
    avoid_tools:
      - codex-mem
      - eagle-mem
  multirepo:
    description: "Работа идёт сразу по нескольким репозиториям или нужно понять surface между компонентами."
    suggest_tools: []
    conditional_tools:
      - codex-agent-mem
    avoid_tools:
      - codex-mem
      - eagle-mem
  large_framework_app:
    description: "Крупное web-приложение на framework stack, где нужны architecture/impact вопросы."
    suggest_tools: []
    conditional_tools: []
    condition: "Large/framework labels alone do not enable optional tools. Context7 needs an explicit library/API/version task; context-mode needs already-large generated output; CodeGraph needs exact screening_policy match."
    evidence: python-openspec-all-tools-ai-tester-2026-05-28
  go_service:
    description: "Средний Go сервис с интеграциями."
    conditional_tools:
      - codex-agent-mem
    baseline_first:
      - rg
  small_microservice:
    description: "Малый сервис, где точный поиск обычно быстрее любых индексов."
    suggest_tools: []
    baseline_first:
      - rg
    avoid_tools:
      - graphify
      - codegraph
      - context-mode
      - codex-mem
      - agent-memory
      - eagle-mem
task_signals:
  exact_file_or_symbol_lookup:
    recommend:
      - rg
    avoid:
      - graphify
      - codegraph
      - context-mode
  architecture_or_impact_discovery:
    recommend: []
    conditional: []
  multirepo_surface_mapping:
    recommend: []
    conditional: []
  resume_previous_work:
    recommend:
      - codex-agent-mem
  open_work_or_completion_check:
    recommend:
      - codex-agent-mem
  large_command_output_compression:
    recommend:
      - context-mode
  version_sensitive_library_docs:
    recommend:
      - context7
  explicit_graph_quality_experiment:
    conditional:
      - graphify
  manual_durable_notes:
    conditional:
      - agent-memory
  codex_history_search:
    avoid_by_default:
      - codex-mem
tools:
  graphify:
    display_name: Graphify
    doc: graphify.md
    results_doc: graphify-benchmark-results.md
    repository: "https://github.com/safishamsi/graphify"
    tested_version: "graphifyy 0.8.17"
    decision: manual_quality_experiment_only
    recommendation_action: suggest_only_for_explicit_graph_quality_experiment
    integration_role: repo_graph_provider
    install_policy: explicit_user_opt_in_only
    stable_cli: true
    mcp_status: works_after_installing_python_mcp
    read_scope: explicit_project_path
    purge_path: "delete graphify-out/ or run graphify uninstall --purge if installed"
    allowed_in:
      - aif-analyze
      - aif-explore
      - aif-architecture
      - aif-plan
      - aif-review
    forbidden_in:
      - aif-rules-check
      - aif-implement
      - aif-fix
      - aif-verify
      - aif-done
      - aif-commit
    privacy_caveat: "Reads only an explicit project path, but generated graph output can contain source-derived structure and must be reviewed before storage."
    recommended_for:
      tasks:
        - explicit_graph_quality_experiment
    conditional_for:
      project_shapes:
        - multirepo
        - large_framework_app
        - large_legacy
        - go_service
      tasks:
        - explicit_graph_quality_experiment
      condition: "Только если пользователь явно хочет graph-shaped quality experiment после baseline rg и принимает overhead; не выбирать автоматически по project labels."
    do_not_recommend_for:
      project_shapes:
        - small_microservice
      tasks:
        - exact_file_or_symbol_lookup
        - durable_session_memory
    suggestion_text: "Graphify можно предложить только как явный graph-shaped quality experiment после baseline rg; текущий ai-tester не подтверждает экономию token/time на mini, large framework или multirepo labels."
    screening_policy:
      evidence: targeted-graphify-context7-ai-tester-2026-05-28
      default_decision: avoid_by_default
      baseline: rg
      require_baseline_first: true
      do_not_select_by: [language_only, broad_shape_only, architecture_task_only, multirepo_only]
      conditional_cases:
        - id: explicit_graph_quality_experiment
          skills: [aif-analyze, aif-explore, aif-plan, aif-review]
          tasks: [explicit_graph_quality_experiment]
          recommendation_gate: "User explicitly requests a graph-shaped quality experiment after rg and accepts measured overhead."
    execution:
      default:
        mode: read_existing_reviewed_output
        allowed_paths:
          - graphify-out/GRAPH_REPORT.md
          - graphify-out/graph.json
          - .ai-factory/references/graphify/GRAPH_REPORT.md
          - .ai-factory/state/<change-id>/graphify/GRAPH_REPORT.md
        forbidden_commands:
          - graphify install
          - graphify .
        notes: "Read existing reviewed reports only unless the user runs Graphify outside AIFHub command ownership."
  codex-agent-mem:
    display_name: codex-agent-mem
    doc: codex-agent-mem.md
    results_doc: codex-agent-mem-benchmark-results.md
    repository: "https://github.com/MarceloCaporale/codex-agent-mem"
    tested_version: "Python source package 1.0.2 from GitHub"
    decision: optional
    recommendation_action: suggest_when_continuity_needed
    integration_role: read_only_continuity_memory
    install_policy: explicit_user_opt_in_only
    stable_cli: source_installable_from_github_and_cli_help_verified
    mcp_status: source_install_and_read_only_minimal_mcp_verified
    read_scope: explicit_sqlite_db_path
    purge_path: "delete configured SQLite DB and sidecar files"
    allowed_in:
      - aif-analyze
      - aif-explore
      - aif-review
    forbidden_in:
      - aif-architecture
      - aif-plan
      - aif-rules-check
      - aif-implement
      - aif-fix
      - aif-verify
      - aif-done
      - aif-commit
    privacy_caveat: "Reads only the configured SQLite memory DB in read-only/minimal mode; it is not a source code index and cannot satisfy OpenSpec gates. Use minimal profile by default; full read-only lists mutating tool names even though mutating calls return isError and do not write."
    recommended_for:
      tasks:
        - resume_previous_work
        - open_work_or_completion_check
        - compact_handoff_context
    conditional_for:
      project_shapes:
        - multirepo
        - large_legacy
        - go_service
      condition: "Есть prior memory DB или пользователь хочет continuity между сессиями."
    do_not_recommend_for:
      tasks:
        - initial_code_discovery
        - exact_file_or_symbol_lookup
        - architecture_graphing
    suggestion_text: "Если нужен resume/open-work context между сессиями, можно предложить codex-agent-mem в read-only minimal MCP mode с explicit DB path. Install/setup остается user-owned; package source is GitHub/Python, not npm."
    execution:
      default:
        mode: read_existing_reviewed_output
        requires_explicit_path: true
        notes: "Read only the configured SQLite DB or reviewed continuity notes. Prefer codex-agent-mem-mcp --read-only --profile minimal --response-mode compact; do not use full profile as the default low-impact mode."
  context-mode:
    display_name: context-mode
    doc: context-mode.md
    results_doc: context-mode-benchmark-results.md
    repository: "https://github.com/mksglu/context-mode"
    tested_version: "1.0.151"
    decision: manual_helper_only
    recommendation_action: suggest_only_for_large_temporary_outputs
    integration_role: temporary_output_index
    install_policy: explicit_user_opt_in_only
    stable_cli: partial
    mcp_status: verified
    read_scope: explicit_indexed_content
    purge_path: "ctx_purge with session or project scope"
    allowed_in:
      - aif-analyze
      - aif-explore
    forbidden_in:
      - aif-architecture
      - aif-plan
      - aif-review
      - aif-rules-check
      - aif-implement
      - aif-fix
      - aif-verify
      - aif-done
      - aif-commit
    privacy_caveat: "Everything explicitly indexed becomes retrievable; never compress protected validation artifacts in place and always purge temporary content."
    recommended_for:
      tasks:
        - large_command_output_compression
        - temporary_one_session_retrieval
    do_not_recommend_for:
      tasks:
        - persistent_project_memory
        - source_code_indexing
      project_shapes:
        - small_microservice
    suggestion_text: "Если анализ генерирует очень большой output, можно предложить context-mode как manual temporary index с обязательным purge."
    execution:
      default:
        mode: recommend_only
        notes: "Recommend temporary explicit-output indexing only; do not compress protected artifacts in place."
  context7:
    display_name: Context7
    doc: context7.md
    results_doc: context7-benchmark-results.md
    repository: "https://github.com/upstash/context7"
    tested_version: "ctx7 0.4.4"
    decision: optional
    recommendation_action: suggest_for_version_sensitive_docs
    integration_role: optional_docs_provider
    install_policy: explicit_user_opt_in_only
    stable_cli: true_for_help_and_lookup
    mcp_status: user_configured_optional
    read_scope: explicit_library_or_docs_query
    purge_path: "delete reviewed notes under .ai-factory/references/context7/ or .ai-factory/state/<change-id>/context7/"
    allowed_in:
      - aif-analyze
      - aif-explore
      - aif-architecture
      - aif-plan
      - aif-review
      - aif-rules-check
    forbidden_in:
      - aif-implement
      - aif-fix
      - aif-verify
      - aif-done
